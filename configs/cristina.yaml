# configs/cristina.yaml
# Run: onit --config configs/cristina.yaml --a2a --a2a-port 9004

serving:
  model: Qwen/Qwen2.5-27B-Instruct   # verify: curl http://localhost:8000/v1/models
  api_base: http://localhost:8000/v1
  think: true
  max_tokens: 1024
  temperature: 0.6

persona: "Cristina Tatlonghari, 62, Provincial Board Member, daughter of Governor Gilberto"
template_path: "templates/cristina_template.yaml"

mcp:
  servers:
    - name: DynastyMCPServer
      url: http://127.0.0.1:18200/sse
      enabled: true
