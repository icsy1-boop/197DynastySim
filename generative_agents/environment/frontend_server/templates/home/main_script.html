{% load static %}

<div id="step" style="display:none">{{step}}</div>
<div id="sim_code" style="display:none">{{sim_code}}</div>
<div id="sec_per_step" style="display:none">{{sec_per_step|default:10}}</div>
<div id="mode" style="display:none">{{mode}}</div>
<div id="persona_name_list" style="display:none">{{persona_name_str}}</div>
<div id="persona_init_pos" style="display:none">
	{% for i in persona_init_pos %}
		<span>{{i.0}},{{i.1}},{{i.2}}</span>
	{% endfor %}
</div>

<script type="text/javascript">
	/*
	  Main resources: 
	  https://www.youtube.com/watch?v=cKIG1lKwLeo&t=401s&ab_channel=HongLy
	  For the ground zero code, see the exported files from here: 
	  https://codepen.io/mikewesthad/pen/BVeoYP?editors=1111 

	  Also worth taking a look: 
	  https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  and 
	  https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	 */


	// ###########################################################################
	// PREAMBLE
	// ###########################################################################

	// <step> -- one full loop around all three phases determined by <phase> is 
	// a step. We use this to link the steps in the backend. 
	let step = parseInt(document.getElementById('step').innerHTML);
	let sim_code = document.getElementById('sim_code').innerHTML;
	let sec_per_step = parseInt(document.getElementById('sec_per_step').innerHTML) || 10;
	let sim_mode = document.getElementById('mode').innerHTML.trim(); // "simulate" | "replay"
	// let persona_names = document.getElementById('persona_name_list').innerHTML.split(",");

	let spans = document.getElementById('persona_init_pos').getElementsByTagName('span');
	let persona_names = {};
	for(var i = 0, l = spans.length; i < l; i++){
		let x = spans[i].innerText.split(",");
		persona_names[x[0]] = [parseInt(x[1]), parseInt(x[2])]
	}


	// Phaser 3.0 global settings. 
	// Configuration meant to be passed to the main Phaser game instance. 
	const config = {
	  type: Phaser.AUTO,
	  width: window.innerWidth,
	  height: window.innerHeight,
	  parent: "game-container",
	  pixelArt: true,
	  scale: {
	    mode: Phaser.Scale.RESIZE,
	    autoCenter: Phaser.Scale.NO_CENTER },
	  physics: {
	    default: "arcade",
	    arcade: {
	      gravity: { y: 0 } } },
	  scene: {
	    preload: preload,
	    create: create,
	    update: update } };

	// const config = {
	//   type: Phaser.AUTO,
	//   width: 4480,
	//   height: 3200,
	//   parent: "game-container",
	//   pixelArt: true,
	//   physics: {
	//     default: "arcade",
	//     arcade: {
	//       gravity: { y: 0 } } },
	//   scene: {
	//     preload: preload,
	//     create: create,
	//     update: update },
	//   scale: {zoom: 0.5} };

	// Creating the game instance and setting up the main Phaser variables that  
	// will be used in it. 
	const game = new Phaser.Game(config);
	let cursors;
	let player;
	let showDebug = false;
	// Set true by a persona sprite's pointerdown so the scene-level pointerdown
	// skips starting a camera drag (click selects the agent instead of panning).
	let suppress_drag = false;

	// Persona related variables. This should have the name of the persona as its
	// keys, and the instances of the Persona class as the values.
	// persona_name -> true while a tween chain is running for that persona
	let persona_animating = {};
	// Tracks the last known tile [x, y] for each persona in JS (used in replay
	// to animate from current position to next step destination without snapping).
	let persona_tile_pos = {};
	// persona_name -> true once the first tween has fired (so we know the sprite
	// has been snapped to path[0] at least once and persona_tile_pos is accurate).
	let persona_initialized = {};

	var spawn_tile_loc = {};
	// for (var i = 0; i < persona_names.length; i++) { 
	// 	spawn_tile_loc[persona_names[i]] = [0, 0]
	// }

	for (var key in persona_names){
		spawn_tile_loc[key] = persona_names[key] ;
		persona_tile_pos[key] = [persona_names[key][0], persona_names[key][1]];
	}
	console.log(spawn_tile_loc);

	var personas = {};
	var pronunciatios = {};
	let anims_direction;
	let pre_anims_direction;
	let pre_anims_direction_dict = {};

	let curr_maze = "barangay_mabuhay";

	// <tile_width> is the width of one individual tile (tiles are square)
	let tile_width = 32;

	// <ms_per_tile> controls how long (wall-clock) each tile hop takes during
	// the tween animation. Lower = faster playback. At 1 hr/step a persona may
	// traverse many tiles; 100 ms/tile keeps the walk readable without being
	// too slow for long paths.
	let ms_per_tile = 100;

	// <timer_max> determines how frequently our update function will query the
	// frontend server. If it's higher, we wait longer cycles.
	let timer_max = 0;
	let timer = timer_max;
	// Guard: only ever one update_environment request in flight. Without this the
	// loop fires a POST every animation frame while waiting for a response; with
	// 500-agent movement files + single-threaded Django that floods the browser
	// with connections (net::ERR_INSUFFICIENT_RESOURCES).
	let update_inflight = false;

	// <phase> -- phases: "process," "update," "execute," and "converse."
	// "converse" is entered after every agent has finished walking for a step;
	// it plays the step's conversations out one line at a time (MMORPG-style)
	// before advancing to the next step.
	let phase = "update";

	// ---- Conversation bubble playback state ----
	// After the walk for a step finishes we collect every spoken turn across all
	// agents into <conversation_queue> and reveal them one at a time: the speaker
	// of each turn shows the line in their bubble for <convo_frames_per_line>
	// frames (~1s). Only when the queue is drained do we advance the step.
	let conversation_queue = [];   // [{speaker, text}, ...] for the current step
	let convo_index = 0;           // index of the turn currently shown
	let convo_frame_counter = 0;   // frames the current turn has been visible
	let convo_frames_per_line = 600;// ~1s at 60fps
	let convo_built = false;       // guard: build the queue once per step
	// Full (untruncated) bubble text per agent for the line they are currently
	// "speaking," so hover/click can show the whole utterance.
	let bubble_full_text = {};
	// Agents whose bubble is currently pinned to full text (selected/hovered).
	let bubble_pinned = {};
	let BUBBLE_TRUNCATE = 100;     // chars shown before truncating with an ellipsis

	// Variables for storing movements that are sent from the backend server.
	// init_movement pre-loads the current step so execute_movement is never
	// undefined on first/late load.
	let execute_movement = {{ init_movement|safe }};

	// Render a line into an agent's bubble. By default the text is truncated for
	// readability on the map; the full utterance is kept in <bubble_full_text> so
	// hover/click can expand it. <speaker> is prefixed so it reads like chat.
	function setBubbleLine(name, speaker, text) {
		let full = (speaker ? speaker + ": " : "") + text;
		bubble_full_text[name] = full;
		let shown = (bubble_pinned[name] || full.length <= BUBBLE_TRUNCATE)
			? full
			: full.slice(0, BUBBLE_TRUNCATE - 1) + "…";
		pronunciatios[name].setText(shown).setVisible(true);
	}

	// Hide an agent's bubble and clear its remembered line.
	function clearBubble(name) {
		bubble_full_text[name] = "";
		pronunciatios[name].setText("").setVisible(false);
	}

	// Pin/unpin an agent's bubble to its full (untruncated) line. Used on hover
	// and click so the whole utterance is readable without leaving the map.
	function setBubbleFull(name, pinned) {
		bubble_pinned[name] = pinned;
		let full = bubble_full_text[name];
		if (!full) return;                       // nothing being said right now
		let shown = (pinned || full.length <= BUBBLE_TRUNCATE)
			? full
			: full.slice(0, BUBBLE_TRUNCATE - 1) + "…";
		pronunciatios[name].setText(shown).setVisible(true);
	}


	// ###########################################################################
	// ENGINE
	// ###########################################################################

	// Joon: Phaser 3.0 is oriented around "scenes" -- recall how Pokemon plays: 
	//       there is the outdoor space, and then there is the indoor space; when
	//       you go inside, you transition to a new "scene" and the outdoor space
	//       basically disappears. 
	//       A scene in Phaser has four key methods that are called at different
	//       stages of rendering for different purposes. They are: 
	//       init() -> preload() -> create() -> update()
	//         init() is called only once at the very beginning. This is the 
	//           initialization function in case that is needed. 
	//         preload() is called once and preloads any of the assets
	//         create() is also called once after preloading... creates sprites 
	//           and actually displays stuff
	//         update() is called on each frame during the game play 

	function preload() {  
	  // Loading the necessary images (e.g., the background image, character 
	  // sprites). 

	  // Joon: for load.image, the first parameter is simply the key value that
	  //       you are passing in. The second parameter should be pointed to the
	  //       png file that contains the tileset. 
	  //       Also IMPORTANT: when you create a tileset in Tiled, always be  
	  //       sure to check the "embedded" option. 
	  this.load.image("Ground", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Ground.png' %}");
	  this.load.image("Village", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Village.png' %}");
	  this.load.image("Water", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Water.png' %}");
	  this.load.image("Room_Builder", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Room_Builder.png' %}");
	  this.load.image("Harbour", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Harbour.png' %}");
	  this.load.image("interiors_pt4", "{% static 'assets/barangay_mabuhay/visuals/tilesets/interiors_pt4.png' %}");
	  this.load.image("interiors_pt1", "{% static 'assets/barangay_mabuhay/visuals/tilesets/interiors_pt1.png' %}");
	  this.load.image("interiors_pt2", "{% static 'assets/barangay_mabuhay/visuals/tilesets/interiors_pt2.png' %}");
	  this.load.image("interiors_pt3", "{% static 'assets/barangay_mabuhay/visuals/tilesets/interiors_pt3.png' %}");
	  this.load.image("interiors_pt5", "{% static 'assets/barangay_mabuhay/visuals/tilesets/interiors_pt5.png' %}");
	  this.load.image("Caves", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Caves.png' %}");
	  this.load.image("Construction", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Construction.png' %}");
	  this.load.image("Small_Houses_1", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Small_Houses_1.png' %}");
	  this.load.image("Small_Houses_2", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Small_Houses_2.png' %}");
	  this.load.image("Forest", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Forest.png' %}");
	  this.load.image("blocks_1", "{% static 'assets/barangay_mabuhay/visuals/tilesets/blocks_1.png' %}");
	  this.load.image("blocks_2", "{% static 'assets/barangay_mabuhay/visuals/tilesets/blocks_2.png' %}");
	  this.load.image("blocks_3", "{% static 'assets/barangay_mabuhay/visuals/tilesets/blocks_3.png' %}");
	  this.load.image("Field", "{% static 'assets/barangay_mabuhay/visuals/tilesets/Field.png' %}");

	  // Joon: This is the export json file you get from Tiled.
	  this.load.tilemapTiledJSON("map", "{% static 'assets/barangay_mabuhay/visuals/barangay_mabuhay_visual.json' %}");

	  // An atlas is a way to pack multiple images together into one texture. I'm 
	  // using it to load all the player animations (walking left, walking right, 
	  // etc.) in one image. For more info see:
	  // https://labs.phaser.io/view.html?src=src/animation/texture%20atlas%20animation.js
	  // If you don't use an atlas, you can do the same thing with a spritesheet, 
	  // see: https://labs.phaser.io/view.html?src=src/animation/single%20sprite%20sheet.js
	  // Joon: Technically, I think this guy had the best tutorial for atlas: 
	  //       https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  // Local copy of the misa character atlas (was an external GitHub CDN URL,
	  // which the browser can't always reach — breaking sprite creation).
	  this.load.atlas("atlas",
	                  "{% static 'assets/characters/misa_atlas/atlas.png' %}",
	                  "{% static 'assets/characters/misa_atlas/atlas.json' %}");
	}

	function create() {  
	  const map = this.make.tilemap({ key: "map" });
	  // Joon: Logging map is really helpful for debugging here: 
	  //       console.log(map);

	  // The first parameter is the name you gave to the tileset in Tiled and then
	  // the key of the tileset image in Phaser's cache (i.e. the name you used in
	  // preload)
	  // Joon: for the first parameter here, really take a look at the 
	  //       console.log(map) output. You need to make sure that the name 
	  //       matches.
	  const Ground = map.addTilesetImage("Ground", "Ground");
	  const Village = map.addTilesetImage("Village", "Village");
	  const Water = map.addTilesetImage("Water", "Water");
	  const Room_Builder = map.addTilesetImage("Room_Builder", "Room_Builder");
	  const Harbour = map.addTilesetImage("Harbour", "Harbour");
	  const interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
	  const interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
	  const interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
	  const interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
	  const interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
	  const Caves = map.addTilesetImage("Caves", "Caves");
	  const Construction = map.addTilesetImage("Construction", "Construction");
	  const Small_Houses_1 = map.addTilesetImage("Small_Houses 1", "Small_Houses_1");
	  const Small_Houses_2 = map.addTilesetImage("Small_Houses 2", "Small_Houses_2");
	  const Forest = map.addTilesetImage("Forest", "Forest");
	  const blocks_1 = map.addTilesetImage("blocks_1", "blocks_1");
	  const blocks_2 = map.addTilesetImage("blocks_2", "blocks_2");
	  const blocks_3 = map.addTilesetImage("blocks_3", "blocks_3");
	  const Field = map.addTilesetImage("Field", "Field");

	  // The first parameter is the layer name (or index) taken from Tiled, the 
	  // second parameter is the tileset you set above, and the final two 
	  // parameters are the x, y coordinate. 
	  // Joon: The "layer name" that comes as the first parameter value  
	  //       literally is taken from our Tiled layer name. So to find out what
	  //       they are; you actually need to open up tiled and see how you 
	  //       named things there. 
	  // All Barangay Mabuhay (dynasty_vilage) art tilesets — used by every layer.
	  let all_ts = [Ground, Village, Water, Room_Builder, Harbour,
	                interiors_pt4, interiors_pt1, interiors_pt2, interiors_pt3, interiors_pt5,
	                Caves, Construction, Small_Houses_1, Small_Houses_2, Forest,
	                blocks_1, blocks_2, blocks_3, Field];
	  // Layer names match the dynasty_vilage.tmx visual layers exactly.
	  const bottomGroundLayer = map.createLayer("Bottom Ground", all_ts, 0, 0);
	  const externalGroundLayer = map.createLayer("External Ground", all_ts, 0, 0);
	  const exteriorDecoration1Layer = map.createLayer("Exterior Decoration 1", all_ts, 0, 0);
	  const exteriorDecoration2Layer = map.createLayer("Exterior Decoration 2", all_ts, 0, 0);
	  const moreForest1Layer = map.createLayer("More Forest 1", all_ts, 0, 0);
	  const moreForest2Layer = map.createLayer("More Forest 2", all_ts, 0, 0);
	  const flooringLayer = map.createLayer("Flooring", all_ts, 0, 0);
	  const wallsLayer = map.createLayer("Walls", all_ts, 0, 0);
	  const interior1Layer = map.createLayer("Interior 1", all_ts, 0, 0);
	  const interior2Layer = map.createLayer("Interior 2", all_ts, 0, 0);
	  const foreground1Layer = map.createLayer("Foreground 1", all_ts, 0, 0);
	  const foreground2Layer = map.createLayer("Foreground 2", all_ts, 0, 0);
	  if (foreground1Layer) foreground1Layer.setDepth(2);
	  if (foreground2Layer) foreground2Layer.setDepth(2);

	  // *** SET UP CAMERA *** 
	  // "player" is to be set as the center of mass for our "camera." We 
	  // basically create a game character sprite as we would for our personas 
	  // but we move it to depth -1 and let it pass through the collision map;  
	  // that is, do not have the following line: 
	  // this.physics.add.collider(player, collisionsLayer);
	  // OLD NOTE: Create a sprite with physics enabled via the physics system. 
	  // The image  used for the sprite has a bit of whitespace, so I'm using 
	  // setSize & setOffset to control the size of the player's body.
	  // Camera start centred on the populated barangay sectors (agents spawn at
	  // pixel y ~3900-7200 on this 390x280 map; the old 800,288 corner was empty).
	  player = this.physics.add.
	                sprite(2912, 3648, "atlas", "misa-front").
	                setSize(30, 40).
	                setOffset(0, 0);
	  player.setDepth(-1);
	  // Setting up the camera. Instead of locking the camera to the invisible
	  // player sprite (which would fight click-drag / arrow panning), we center
	  // once on the populated sectors and then let the user drive the camera
	  // directly via wheel-zoom, click-drag, and arrow keys.
	  const camera = this.cameras.main;
	  camera.setBounds(0, 0, map.widthInPixels, map.heightInPixels);
	  camera.centerOn(2912, 3648);
	  cursors = this.input.keyboard.createCursorKeys();

	  // Mousewheel zoom: scroll up = zoom in, scroll down = zoom out (0.2x – 3x).
	  this.input.on("wheel", function(pointer, gameObjects, deltaX, deltaY) {
	    const cam = this.cameras.main;
	    const newZoom = Phaser.Math.Clamp(cam.zoom - deltaY * 0.001, 0.2, 3);
	    cam.setZoom(newZoom);
	  }, this);

	  // *** CLICK-AND-DRAG PANNING ***
	  // Drag anywhere on empty map to pan. We track drag on the scene-level
	  // pointer; a drag that starts on a persona sprite is suppressed (the
	  // sprite's own pointerdown sets <suppress_drag>) so clicking an agent
	  // selects them instead of panning.
	  let is_dragging = false;
	  let drag_start = { x: 0, y: 0 };
	  this.input.on("pointerdown", function(pointer) {
	    if (suppress_drag) { suppress_drag = false; return; }
	    is_dragging = true;
	    drag_start.x = pointer.x;
	    drag_start.y = pointer.y;
	  }, this);
	  this.input.on("pointermove", function(pointer) {
	    if (!is_dragging) return;
	    const cam = this.cameras.main;
	    cam.scrollX -= (pointer.x - drag_start.x) / cam.zoom;
	    cam.scrollY -= (pointer.y - drag_start.y) / cam.zoom;
	    drag_start.x = pointer.x;
	    drag_start.y = pointer.y;
	  }, this);
	  const end_drag = function() { is_dragging = false; };
	  this.input.on("pointerup", end_drag, this);
	  this.input.on("pointerupoutside", end_drag, this);

	  // *** SET UP PERSONAS *** 
	  // We start by creating the game sprite objects. 
	  for (let i=0; i<Object.keys(spawn_tile_loc).length; i++) { 
	    let persona_name = Object.keys(spawn_tile_loc)[i];
	    let start_pos = [spawn_tile_loc[persona_name][0] * tile_width + tile_width / 2, 
	                     spawn_tile_loc[persona_name][1] * tile_width + tile_width];
	    let new_sprite = this.physics.add
	                         .sprite(start_pos[0], start_pos[1], "atlas", "misa-front")
	                         .setSize(30, 40)
	                         .setOffset(0, 32); // DEBUG 1 --- I added 32 offset on Dec 29. 
	    // Here, we are creating the persona and its speech-bubble sprite.
	    personas[persona_name] = new_sprite;
	    // The floating bubble defaults to MMORPG-style behaviour: it shows the
	    // live conversation between agents and is hidden whenever the agent is
	    // not chatting. (Emoji output is deprecated; any emoji is routed to the
	    // agent stats panel instead.) Start hidden — the update loop turns it on
	    // only while there is active chat.
	    // <resolution> renders the text bitmap at a multiple of its on-screen size
	    // so it stays crisp when the camera zooms in. Without this the global
	    // pixelArt:true setting (needed for the tilemap) upscales the small text
	    // texture with nearest-neighbour filtering and it looks pixelated/blocky.
	    let label = this.add.text(
	                                   new_sprite.body.x - 6,
	                                   new_sprite.body.y - 42 - 32, // DEBUG 1 --- I added 32 offset on Dec 29.
	                                   "", {
	                                   fontFamily: "Arial, Helvetica, sans-serif",
	                                   fontSize: "18px",
	                                   color: "#000000",
	                                   resolution: 3 * (window.devicePixelRatio || 1),
	                                   padding: { x: 8, y: 8},
	                                   backgroundColor: "#ffffff",
	                                   borderRadius:"10px",
	                                   wordWrap: { width: 240 }}).setDepth(3).setVisible(false);
	    // Set resolution explicitly too: the constructor style is honoured
	    // inconsistently across Phaser versions, but setResolution() is reliable.
	    label.setResolution(3 * (window.devicePixelRatio || 1));
	    pronunciatios[persona_name] = label;

	    // *** CLICK / HOVER INTERACTIVITY ***
	    // Both the sprite and its floating label open the side panel on click and
	    // show the hover tooltip. selectPersona / showTooltip / hideTooltip live
	    // in home.html. We capture persona_name per-iteration via a closure.
	    const pn = persona_name;
	    [new_sprite, label].forEach(obj => {
	      obj.setInteractive({ useHandCursor: true });
	      obj.on("pointerdown", function(pointer, lx, ly, event) {
	        suppress_drag = true;            // don't start a camera drag
	        if (event) event.stopPropagation();
	        // Clicking selects the agent and pins its bubble to the full line so
	        // it stays expanded while the stats panel is open.
	        selectPersona(pn);
	        setBubbleFull(pn, true);
	      });
	      obj.on("pointerover", function(pointer) {
	        showTooltip(pn, pointer.event.clientX, pointer.event.clientY);
	        setBubbleFull(pn, true);         // expand the bubble on hover
	      });
	      obj.on("pointermove", function(pointer) {
	        showTooltip(pn, pointer.event.clientX, pointer.event.clientY);
	      });
	      obj.on("pointerout", function() {
	        hideTooltip();
	        // Keep the full line only if this agent is the selected one; otherwise
	        // collapse back to the truncated bubble.
	        let active = document.getElementById("persona_panel").getAttribute("data-active-persona");
	        if (active !== pn) setBubbleFull(pn, false);
	      });
	    });
	  }

	  // Create the player's walking animations from the texture atlas. These are
	  // stored in the global animation manager so any sprite can access them.
	  const anims = this.anims;
	  anims.create({
	    key: "misa-left-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-left-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  anims.create({
	    key: "misa-right-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-right-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  anims.create({
	    key: "misa-front-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-front-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  anims.create({
	    key: "misa-back-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-back-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });
	}


	function update(time, delta) {
		// *** SETUP PLAY AND PAUSE BUTTON *** 
		let play_context = this;
		function game_resume() {  
			play_context.scene.resume();
		}  
		play_button.onclick = function(){
			game_resume();
		};
		function game_pause() {  
			play_context.scene.pause();
		}  
		pause_button.onclick = function(){
			game_pause();
		};

	  // *** MOVE CAMERA ***
	  // The camera is no longer locked to the player sprite, so arrow keys scroll
	  // the camera directly. Speed is divided by zoom so panning feels consistent
	  // at any zoom level. Click-drag panning is wired up in create().
	  const camera_speed = 12;
	  const cam = this.cameras.main;
	  const pan_step = camera_speed / cam.zoom;
	  if (cursors.left.isDown)  cam.scrollX -= pan_step;
	  if (cursors.right.isDown) cam.scrollX += pan_step;
	  if (cursors.up.isDown)    cam.scrollY -= pan_step;
	  if (cursors.down.isDown)  cam.scrollY += pan_step;

	  // console.log("phase: " + phase + ", step: " + step);
	  // *** MOVE PERSONAS ***
	  // Moving personas take place in three distinct phases: "process," "update,"
	  // and "execute." These phases are determined by the value of <phase>. 
	  // Only one of the three phases is incurred in each update cycle. 
	  if (phase == "process") {
    // VIEW-ONLY: headless_env.py is the sole environment driver. The browser
    // must NOT write environment files here, or it overwrites headless_env and
    // freezes every agent at its sprite tile. Skip straight to polling movement.
    phase = "update";
  } 

	  else if (phase == "update") { 
	    // Update is where we * wait * for the backend server to finish 
	    // computing about what the personas will do next given their current 
	    // situation. 
	    // We do this by continuously asking the backend server if it is ready. 
	    // The backend server is ready when it returns a json that has a key-val
	    // pair with "<move>": true.
	    // Note that we do not want to overburden the backend too much by 
	    // over-querying; so, we have a timer set so we only query it once every
	    // timer_max cycles. 
	    if (timer <= 0 && !update_inflight) {
	      update_inflight = true;
	      var update_xobj = new XMLHttpRequest();
	      update_xobj.overrideMimeType("application/json");
	      update_xobj.open('POST', "{% url 'update_environment' %}", true);
	      update_xobj.addEventListener("load", function() {
	        update_inflight = false;
	        if (this.readyState === 4) {
	          if (update_xobj.status === 200) {
	            if (JSON.parse(update_xobj.responseText)["<step>"] == step) {
	              execute_movement = JSON.parse(update_xobj.responseText)
	              phase = "execute";
	            }
	            timer = timer_max;
	          }
	        }
	      });
	      update_xobj.addEventListener("error", function() { update_inflight = false; });
	      update_xobj.addEventListener("abort", function() { update_inflight = false; });
	      update_xobj.send(JSON.stringify({"step": step, "sim_code": sim_code }));
	    }
	    timer = timer - 1;
	  } 

	  else if (phase == "execute") {
	    // Execute phase: animate all personas along their waypoint paths using
	    // Phaser tween chains, then move to the "converse" phase once every
	    // persona has finished moving.
	    document.getElementById("game-time-content").innerHTML = execute_movement["meta"]["curr_time"];

	    // Update action-description panel and pronunciatio labels immediately.
	    for (let i = 0; i < Object.keys(personas).length; i++) {
	      let curr_persona_name = Object.keys(personas)[i];
	      let curr_persona_name_os = curr_persona_name.replace(/ /g, "_");
	      let persona_data = execute_movement["persona"][curr_persona_name];
	      if (!persona_data) continue;

	      let pronunciatio_content = persona_data["pronunciatio"];
	      let description_content = persona_data["description"];

	      // Fill the hidden spans that the stats panel and hover tooltip read.
	      // The full transcript lives here (with <br>); the floating bubbles do
	      // NOT show it — bubbles play line-by-line during the "converse" phase.
	      let chat_content = "";
	      if (persona_data["chat"] != null) {
	        for (let j = 0; j < persona_data["chat"].length; j++) {
	          chat_content += persona_data["chat"][j][0] + ": " + persona_data["chat"][j][1] + "<br>";
	        }
	      } else {
	        chat_content = "<em>None at the moment</em>";
	      }

	      document.getElementById("current_action__" + curr_persona_name_os).innerHTML = description_content.split("@")[0];
	      document.getElementById("target_address__" + curr_persona_name_os).innerHTML = description_content.split("@")[1];
	      document.getElementById("chat__" + curr_persona_name_os).innerHTML = chat_content;
	      // Emoji (when an enabled run produced one) is surfaced in the stats panel.
	      document.getElementById("pronunciatio__" + curr_persona_name_os).innerHTML = pronunciatio_content || "";
	    }

	    // New step's movement data has arrived: reset the conversation playback so
	    // the "converse" phase rebuilds the queue once walking is done.
	    convo_built = false;

	    // If the side panel is open, refresh its visible fields from the freshly
	    // written live spans. syncPanel is a no-op when no persona is selected.
	    let _active = document.getElementById("persona_panel").getAttribute("data-active-persona");
	    if (_active) syncPanel(_active);

	    let all_persona_names = Object.keys(personas);

	    if (sim_mode === "simulate" && sec_per_step >= 3600) {
	      // ---- SIMULATE MODE (large step size): TELEPORT ----
	      // No animation — snap every persona to their destination tile and
	      // update the tracked tile position so replay stays consistent.
	      all_persona_names.forEach(curr_persona_name => {
	        let curr_persona = personas[curr_persona_name];
	        let curr_pronunciatio = pronunciatios[curr_persona_name];
	        let persona_data = execute_movement["persona"][curr_persona_name];
	        if (!persona_data) return;
	        let dest = persona_data["movement"];

	        curr_persona.setPosition(dest[0] * tile_width, dest[1] * tile_width);
	        curr_pronunciatio.x = curr_persona.x - 6;
	        curr_pronunciatio.y = curr_persona.y - 42 - 32;
	        curr_persona.anims.stop();
	        persona_tile_pos[curr_persona_name] = [dest[0], dest[1]];
	      });
	      // Everyone has arrived (instantly): play out this step's conversations
	      // before advancing.
	      phase = "converse";

	    } else {
	      // ---- REPLAY / SMALL-STEP MODE: ANIMATE CURRENT→DESTINATION ----
	      // For each persona, animate from their current tracked tile position
	      // to the destination tile in the movement data.  We build a waypoint
	      // list starting with the persona's current pixel position (already
	      // on-screen, no snap needed) and appending the path tiles from the
	      // movement JSON.  This means there is never a visual jump between
	      // steps: the tween picks up exactly where the previous one left off.
	      let scene = this;
	      // If ANY persona is still animating, wait — don't start the next step
	      // for anyone. This prevents fast-finishing personas from jumping ahead
	      // to the next step's data while slow ones are still mid-tween.
	      if (all_persona_names.some(n => persona_animating[n])) return;

	      let total = all_persona_names.filter(n => execute_movement["persona"][n]).length;
	      let finished_count = 0;
	      if (total === 0) { phase = "converse"; return; }

	      all_persona_names.forEach(curr_persona_name => {
	        let curr_persona = personas[curr_persona_name];
	        let curr_pronunciatio = pronunciatios[curr_persona_name];
	        let persona_data = execute_movement["persona"][curr_persona_name];
	        if (!persona_data) return;
	        let dest = persona_data["movement"]; // final destination tile [x, y]

	        // Build the waypoint list.
	        // path[0] from the backend is typically 1 tile away from the sprite's
	        // current position (the backend re-plans from a slightly different start
	        // each step). To avoid any snap, we tween from the sprite's current pixel
	        // position directly to dest, using the backend path only for direction
	        // guidance on intermediate tiles. We reconstruct the tween list as:
	        //   [current_sprite_tile, ...path_tiles, dest]
	        // but since path already ends at dest, we just use path_tiles and let
	        // the first tween naturally walk the 1-tile gap from current pos.
	        let path_tiles = (persona_data["path"] && persona_data["path"].length > 0)
	          ? persona_data["path"]
	          : [dest];

	        persona_animating[curr_persona_name] = true;

	        let tween_configs = path_tiles.map(([tx, ty]) => {
	          let target_x = tx * tile_width;
	          let target_y = ty * tile_width;
	          return {
	            targets: curr_persona,
	            x: target_x,
	            y: target_y,
	            duration: ms_per_tile,
	            ease: 'Linear',
	            onUpdate: () => {
	              let dx = target_x - curr_persona.x;
	              let dy = target_y - curr_persona.y;
	              let dir = "";
	              if (Math.abs(dx) > Math.abs(dy)) {
	                dir = dx > 0 ? "r" : "l";
	              } else if (dy !== 0) {
	                dir = dy > 0 ? "d" : "u";
	              }
	              if (dir === "l") curr_persona.anims.play("misa-left-walk", true);
	              else if (dir === "r") curr_persona.anims.play("misa-right-walk", true);
	              else if (dir === "u") curr_persona.anims.play("misa-back-walk", true);
	              else if (dir === "d") curr_persona.anims.play("misa-front-walk", true);
	              if (dir) pre_anims_direction_dict[curr_persona_name] = dir;

	              curr_pronunciatio.x = curr_persona.x - 6;
	              curr_pronunciatio.y = curr_persona.y - 42 - 32;
	            }
	          };
	        });

	        scene.tweens.chain({
	          tweens: tween_configs,
	          onComplete: () => {
	            // Snap to exact destination pixel to correct any floating-point drift.
	            curr_persona.setPosition(dest[0] * tile_width, dest[1] * tile_width);
	            curr_pronunciatio.x = curr_persona.x - 6;
	            curr_pronunciatio.y = curr_persona.y - 42 - 32;

	            // Update the tracked tile so the next step starts from here.
	            persona_tile_pos[curr_persona_name] = [dest[0], dest[1]];

	            curr_persona.anims.stop();
	            let d = pre_anims_direction_dict[curr_persona_name];
	            if (d === "l") curr_persona.setTexture("atlas", "misa-left");
	            else if (d === "r") curr_persona.setTexture("atlas", "misa-right");
	            else if (d === "u") curr_persona.setTexture("atlas", "misa-back");
	            else if (d === "d") curr_persona.setTexture("atlas", "misa-front");

	            persona_animating[curr_persona_name] = false;
	            finished_count++;
	            if (finished_count === total) {
	              // Everyone has finished walking: play out this step's
	              // conversations line-by-line before advancing the step.
	              phase = "converse";
	            }
	          }
	        });
	      });
	    }
	  }

	  else if (phase == "converse") {
	    // ---- CONVERSE PHASE: play this step's conversations line by line ----
	    // All agents have arrived at their tiles. Conversations play in PARALLEL:
	    // a single global line index <convo_index> advances every ~1s, and at each
	    // index every conversation reveals its turn at that index in the speaker's
	    // bubble. The step advances once the index passes the LONGEST conversation,
	    // so a step with many simultaneous chats still finishes in a few seconds.

	    // Build the conversation list once per step.
	    if (!convo_built) {
	      conversation_queue = [];   // here: array of conversations, each = [{speaker,text},...]
	      convo_index = 0;
	      convo_frame_counter = 0;
	      Object.keys(personas).forEach(n => clearBubble(n));

	      // Each persona's "chat" holds the FULL transcript, duplicated on every
	      // participant. Dedupe by transcript contents so each unique conversation
	      // is played only once.
	      let seen = {};
	      Object.keys(personas).forEach(name => {
	        let chat = execute_movement["persona"][name]["chat"];
	        if (!chat || chat.length === 0) return;
	        let key = JSON.stringify(chat);
	        if (seen[key]) return;
	        seen[key] = true;
	        let turns = [];
	        chat.forEach(turn => {
	          if (personas[turn[0]]) turns.push({ speaker: turn[0], text: turn[1] });
	        });
	        if (turns.length) conversation_queue.push(turns);
	      });
	      convo_built = true;
	    }

	    let max_len = conversation_queue.reduce((m, c) => Math.max(m, c.length), 0);
	    let active = document.getElementById("persona_panel").getAttribute("data-active-persona");

	    // Nothing said this step, or every line has been shown: advance the step.
	    if (max_len === 0 || convo_index >= max_len) {
	      Object.keys(personas).forEach(n => { if (n !== active) clearBubble(n); });
	      phase = "process";
	      step = step + 1;
	      return;
	    }

	    // At the start of each ~1s window, reveal the current line of every
	    // conversation in its speaker's bubble (parallel playback).
	    if (convo_frame_counter === 0) {
	      // Speakers active at this index — used so we don't clear a bubble we are
	      // about to (re)write.
	      let speaking = {};
	      conversation_queue.forEach(turns => {
	        if (convo_index < turns.length) speaking[turns[convo_index].speaker] = true;
	      });
	      // Clear bubbles of agents not speaking now (keep the selected agent's).
	      Object.keys(personas).forEach(n => {
	        if (!speaking[n] && n !== active) clearBubble(n);
	      });
	      // Show each conversation's current line above its speaker.
	      conversation_queue.forEach(turns => {
	        if (convo_index >= turns.length) return;   // this convo already ended
	        let turn = turns[convo_index];
	        let sp = personas[turn.speaker];
	        let lbl = pronunciatios[turn.speaker];
	        lbl.x = sp.x - 6;
	        lbl.y = sp.y - 42 - 32;
	        setBubbleLine(turn.speaker, turn.speaker, turn.text);
	      });
	    }

	    convo_frame_counter++;
	    if (convo_frame_counter >= convo_frames_per_line) {
	      convo_frame_counter = 0;
	      convo_index++;
	    }
	  }
	}

	// Control button binders
	var play_button=document.getElementById("play_button");
	var pause_button=document.getElementById("pause_button");
</script>
