<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Reverie</title>

	<!-- Tailwind CSS (CDN, no build step in this Django project) -->
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						ink: "#1f2937",
						panel: "#ffffff",
						accent: "#6366f1",
					},
					fontFamily: {
						sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
					},
				},
			},
		};
	</script>
	<style>
		html, body { height: 100%; }
		body { margin: 0; }
		/* Thin, unobtrusive scrollbars inside panels. */
		.rv-scroll::-webkit-scrollbar { width: 8px; }
		.rv-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
		.rv-scroll::-webkit-scrollbar-track { background: transparent; }
	</style>
</head>

<body class="bg-slate-100 text-ink font-sans antialiased">
	{% block content %}
	{% endblock content %}

	{% block js_content %}
	{% endblock js_content %}
</body>
</html>
