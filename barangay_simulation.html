<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a2e;
  font-family: 'VT323', monospace;
  color: #e8e0c8;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px;
  background: #0d0d1a;
  border-bottom: 2px solid #8b1a1a;
  flex-shrink: 0;
}

#top-bar h1 {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: #f5c842;
  letter-spacing: 1px;
}

.stat-pills {
  display: flex;
  gap: 10px;
}

.pill {
  font-size: 13px;
  padding: 2px 8px;
  border: 1px solid #444;
  border-radius: 2px;
  background: #111;
}

.pill span { color: #f5c842; }

#sim-area {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

#canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}

canvas {
  display: block;
  image-rendering: pixelated;
}

#sidebar {
  width: 200px;
  background: #0d0d1a;
  border-left: 2px solid #8b1a1a;
  display: flex;
  flex-direction: column;
  font-size: 13px;
  overflow: hidden;
}

#sidebar h2 {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: #f5c842;
  padding: 8px;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}

#event-log {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

#event-log::-webkit-scrollbar { width: 4px; }
#event-log::-webkit-scrollbar-track { background: #111; }
#event-log::-webkit-scrollbar-thumb { background: #8b1a1a; }

.event-item {
  font-size: 12px;
  color: #aaa;
  border-left: 2px solid #333;
  padding-left: 5px;
  line-height: 1.3;
  animation: fadeIn .3s ease;
}
.event-item.political { border-color: #a855f7; color: #d8b4fe; }
.event-item.crime     { border-color: #ef4444; color: #fca5a5; }
.event-item.civic     { border-color: #22c55e; color: #86efac; }
.event-item.economy   { border-color: #f5c842; color: #fde68a; }

@keyframes fadeIn { from { opacity:0; transform: translateX(-4px); } to { opacity:1; transform: none; } }

#agent-tooltip {
  position: absolute;
  background: #0d0d1aee;
  border: 1px solid #f5c842;
  padding: 7px 10px;
  font-size: 13px;
  pointer-events: none;
  display: none;
  z-index: 10;
  min-width: 140px;
  line-height: 1.7;
}
#agent-tooltip .name { color: #f5c842; font-size: 14px; }
#agent-tooltip .role { color: #aaa; font-size: 12px; }

#bottom-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px;
  background: #0d0d1a;
  border-top: 2px solid #8b1a1a;
  flex-shrink: 0;
  font-size: 13px;
}

.ctrl-btn {
  font-family: 'VT323', monospace;
  font-size: 15px;
  background: #8b1a1a;
  color: #f5c842;
  border: none;
  padding: 3px 12px;
  cursor: pointer;
  letter-spacing: 1px;
}
.ctrl-btn:hover { background: #b91c1c; }

#speed-label { color: #aaa; }
#clock { color: #f5c842; font-size: 16px; margin-left: auto; }

.legend-row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 12px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

<div id="top-bar">
  <h1>BARANGAY MABUHAY — SIMULATION</h1>
  <div class="stat-pills">
    <div class="pill">Pop: <span id="s-pop">5000</span></div>
    <div class="pill">Corruption: <span id="s-corr">12%</span></div>
    <div class="pill">Welfare: <span id="s-welf">68</span></div>
    <div class="pill">Unrest: <span id="s-unrest">14</span></div>
    <div class="pill">Dynasty: <span id="s-dyn">ON</span></div>
  </div>
</div>

<div id="sim-area">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="agent-tooltip">
      <div class="name" id="tt-name"></div>
      <div class="role" id="tt-role"></div>
      <div id="tt-status"></div>
      <div id="tt-dest"></div>
    </div>
  </div>

  <div id="sidebar">
    <h2>EVENT LOG</h2>
    <div style="padding:6px 8px; border-bottom:1px solid #222;">
      <div class="legend-row"><div class="legend-dot" style="background:#a855f7"></div>Political</div>
      <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>Corruption</div>
      <div class="legend-row"><div class="legend-dot" style="background:#22c55e"></div>Civic</div>
      <div class="legend-row"><div class="legend-dot" style="background:#f5c842"></div>Economy</div>
    </div>
    <div id="event-log"></div>
  </div>
</div>

<div id="bottom-bar">
  <button class="ctrl-btn" id="btn-pause">⏸ PAUSE</button>
  <button class="ctrl-btn" id="btn-speed">SPEED: 1×</button>
  <span id="speed-label">Sim day: <span id="s-day">1</span> &nbsp; Year: <span id="s-year">1</span></span>
  <div id="clock">06:00</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

const zones = {
  farm:        { x:.18, y:.32, w:.14, h:.16, label:'FARM',         color:'#5a3a1a', fill:'#7a5230' },
  factory:     { x:.46, y:.10, w:.22, h:.16, label:'FACTORIES',    color:'#444',    fill:'#555' },
  church:      { x:.44, y:.38, w:.08, h:.07, label:'CHURCH',       color:'#8b1a1a', fill:'#a52020' },
  school:      { x:.38, y:.42, w:.09, h:.07, label:'SCHOOL',       color:'#8b1a1a', fill:'#a52020' },
  hospital:    { x:.56, y:.38, w:.11, h:.07, label:'HOSPITAL',     color:'#8b1a1a', fill:'#a52020' },
  park:        { x:.40, y:.50, w:.08, h:.07, label:'PARK',         color:'#1a5c1a', fill:'#236b23' },
  media:       { x:.54, y:.48, w:.08, h:.07, label:'MEDIA',        color:'#8b1a1a', fill:'#a52020' },
  bgyhall:     { x:.64, y:.48, w:.08, h:.07, label:'BGY. HALL',    color:'#8b1a1a', fill:'#a52020' },
  market:      { x:.42, y:.58, w:.10, h:.07, label:'MARKET',       color:'#8b1a1a', fill:'#a52020' },
  police:      { x:.54, y:.57, w:.07, h:.06, label:'POLICE',       color:'#8b1a1a', fill:'#a52020' },
  audit:       { x:.63, y:.57, w:.06, h:.06, label:'AUDIT',        color:'#8b1a1a', fill:'#a52020' },
  sarisari:    { x:.34, y:.62, w:.07, h:.07, label:'SARI-SARI',    color:'#8b1a1a', fill:'#a52020' },
  contoffice:  { x:.38, y:.68, w:.07, h:.06, label:'CONT. OFF.',   color:'#8b1a1a', fill:'#a52020' },
  bank:        { x:.46, y:.68, w:.07, h:.06, label:'BANK',         color:'#8b1a1a', fill:'#a52020' },
  munhall:     { x:.54, y:.63, w:.12, h:.09, label:'MUNICIPAL\nHALL', color:'#6b0f0f', fill:'#8b1a1a' },
  resA:        { x:.74, y:.55, w:.14, h:.18, label:'RES. A',       color:'#1a3a6b', fill:'#1e4d8c' },
  resB:        { x:.42, y:.80, w:.20, h:.12, label:'RES. B',       color:'#5a1a6b', fill:'#7a2a8c' },
  resC:        { x:.12, y:.55, w:.22, h:.22, label:'RES. C',       color:'#8b4a00', fill:'#b36000' },
};

const roleColors = {
  mayor:'#f5c842', councilor:'#e879f9', contractor:'#fb923c',
  farmer:'#86efac', vendor:'#67e8f9', student:'#818cf8',
  worker:'#94a3b8', police:'#60a5fa', nurse:'#f9a8d4',
  journalist:'#fde68a', unemployed:'#ef4444', elder:'#d1d5db',
};

const ROLE_HOME = {
  mayor:'resA', councilor:'resA', contractor:'resA',
  farmer:'resC', vendor:'resC', unemployed:'resC',
  student:'resB', worker:'resB',
  police:'police', nurse:'hospital', journalist:'media', elder:'resA',
};

const ROLE_WORK = {
  mayor:'munhall', councilor:'munhall', contractor:'contoffice',
  farmer:'farm', vendor:'market', unemployed:'park',
  student:'school', worker:'factory',
  police:'police', nurse:'hospital', journalist:'media', elder:'church',
};

let agentIdCounter = 0;

function randZonePos(zk) {
  const z = zones[zk];
  return {
    x: (z.x + Math.random()*z.w) * canvas.width,
    y: (z.y + Math.random()*z.h) * canvas.height,
  };
}

function createAgent(role) {
  const home = ROLE_HOME[role] || 'resC';
  const pos = randZonePos(home);
  const names = ['Pedro','Maria','Jose','Rosa','Juan','Ana','Carlos','Nena','Berto','Lita','Ramon','Cely','Tony','Fely'];
  const surnames = ['Reyes','Cruz','Santos','Garcia','Lopez','Dela Cruz','Bautista','Ramos'];
  return {
    id: agentIdCounter++,
    name: names[Math.floor(Math.random()*names.length)] + ' ' + surnames[Math.floor(Math.random()*surnames.length)],
    role,
    x: pos.x, y: pos.y,
    tx: pos.x, ty: pos.y,
    homeZone: home,
    workZone: ROLE_WORK[role] || 'market',
    currentZone: home,
    targetZone: home,
    moving: false,
    speed: 0.4 + Math.random()*0.6,
    nextDecision: Math.random()*300,
    status: 'resting',
    color: roleColors[role] || '#aaa',
    r: role === 'mayor' ? 5 : 3,
    trail: [],
  };
}

const agents = [];
const roleDist = {
  mayor:1, councilor:6, contractor:4, farmer:20, vendor:12,
  student:16, worker:20, police:4, nurse:4,
  journalist:2, unemployed:14, elder:10
};
for (const [role, count] of Object.entries(roleDist)) {
  for (let i=0; i<count; i++) agents.push(createAgent(role));
}

let simTime = 6*60;
let simDay = 1, simYear = 1;
let paused = false, speed = 1;
const SPEEDS = [1,2,5,10];
let speedIdx = 0;

document.getElementById('btn-pause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ PLAY' : '⏸ PAUSE';
});
document.getElementById('btn-speed').addEventListener('click', () => {
  speedIdx = (speedIdx+1)%SPEEDS.length;
  speed = SPEEDS[speedIdx];
  document.getElementById('btn-speed').textContent = `SPEED: ${speed}×`;
});

const eventLog = document.getElementById('event-log');
const EVENT_TEMPLATES = [
  { type:'political', texts:['Mayor signed infrastructure contract','Councilor voted against budget bill','Barangay captain distributes aid','Election rally at the plaza'] },
  { type:'crime',     texts:['Ghost project detected at Cont. Office','Auditor flagged suspicious invoice','Police ignored bribe complaint','Contractor overbilled ₱2M on road repair'] },
  { type:'civic',     texts:['School enrollment opens','Health center received supplies','Media reported on road conditions','Farmer cooperative formed'] },
  { type:'economy',   texts:['Market revenue increased 4%','Factory hired 12 workers','Bank loan approved for vendor','Remittance inflow up this quarter'] },
];

function addEvent() {
  const tpl = EVENT_TEMPLATES[Math.floor(Math.random()*EVENT_TEMPLATES.length)];
  const txt = tpl.texts[Math.floor(Math.random()*tpl.texts.length)];
  const el = document.createElement('div');
  el.className = `event-item ${tpl.type === 'crime' ? 'crime' : tpl.type}`;
  const h = String(Math.floor(simTime/60)%24).padStart(2,'0');
  const m = String(simTime%60).padStart(2,'0');
  el.textContent = `[${h}:${m}] ${txt}`;
  eventLog.prepend(el);
  if (eventLog.children.length > 40) eventLog.lastChild.remove();
}

let corruption=12, welfare=68, unrest=14;
function updateStats() {
  corruption = Math.max(5, Math.min(95, corruption + (Math.random()-.48)*0.3));
  welfare    = Math.max(20, Math.min(95, welfare    + (Math.random()-.48)*0.2));
  unrest     = Math.max(0,  Math.min(100,unrest     + (Math.random()-.48)*0.25));
  document.getElementById('s-corr').textContent   = corruption.toFixed(0)+'%';
  document.getElementById('s-welf').textContent   = welfare.toFixed(0);
  document.getElementById('s-unrest').textContent = unrest.toFixed(0);
}

const SCHEDULES = {
  mayor:      [{h:7,z:'munhall'},{h:12,z:'market'},{h:14,z:'munhall'},{h:18,z:'resA'},{h:20,z:'resA'}],
  councilor:  [{h:8,z:'munhall'},{h:12,z:'sarisari'},{h:14,z:'munhall'},{h:17,z:'resA'}],
  contractor: [{h:8,z:'contoffice'},{h:10,z:'munhall'},{h:12,z:'bank'},{h:14,z:'contoffice'},{h:17,z:'resA'}],
  farmer:     [{h:5,z:'farm'},{h:11,z:'market'},{h:13,z:'resC'},{h:15,z:'farm'},{h:18,z:'resC'}],
  vendor:     [{h:4,z:'market'},{h:14,z:'resC'},{h:16,z:'sarisari'}],
  student:    [{h:7,z:'school'},{h:15,z:'park'},{h:17,z:'resB'}],
  worker:     [{h:6,z:'factory'},{h:12,z:'market'},{h:13,z:'factory'},{h:17,z:'resB'}],
  police:     [{h:7,z:'police'},{h:10,z:'market'},{h:14,z:'police'},{h:22,z:'police'}],
  nurse:      [{h:7,z:'hospital'},{h:15,z:'resA'},{h:20,z:'hospital'}],
  journalist: [{h:8,z:'media'},{h:10,z:'munhall'},{h:13,z:'market'},{h:16,z:'media'}],
  unemployed: [{h:9,z:'park'},{h:11,z:'sarisari'},{h:13,z:'resC'},{h:16,z:'park'}],
  elder:      [{h:8,z:'church'},{h:10,z:'resA'},{h:14,z:'park'},{h:17,z:'resA'}],
};

function getScheduledZone(agent) {
  const hour = (simTime/60)%24;
  const sched = SCHEDULES[agent.role] || SCHEDULES.worker;
  let target = agent.homeZone;
  for (const s of sched) { if (hour >= s.h) target = s.z; }
  return target;
}

function moveAgentTo(agent, zoneKey) {
  if (!zones[zoneKey]) return;
  const p = randZonePos(zoneKey);
  agent.tx = p.x; agent.ty = p.y;
  agent.targetZone = zoneKey;
  agent.moving = true;
  agent.status = zoneKey === agent.homeZone ? 'at home' : `going to ${zones[zoneKey].label}`;
}

const tooltip = document.getElementById('agent-tooltip');
let hoveredAgent = null;

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let found = null;
  for (const a of agents) {
    const dx=a.x-mx, dy=a.y-my;
    if (dx*dx+dy*dy < (a.r+4)*(a.r+4)) { found=a; break; }
  }
  hoveredAgent = found;
  if (found) {
    tooltip.style.display = 'block';
    tooltip.style.left = (mx+14)+'px';
    tooltip.style.top  = (my-10)+'px';
    document.getElementById('tt-name').textContent   = found.name;
    document.getElementById('tt-role').textContent   = found.role.toUpperCase();
    document.getElementById('tt-status').textContent = '▸ '+found.status;
    document.getElementById('tt-dest').textContent   = '→ '+(zones[found.targetZone]?.label||'');
  } else {
    tooltip.style.display = 'none';
  }
});

let lastTime=null, eventTimer=0, statsTimer=0;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts-lastTime)/1000, 0.1) * speed;
  lastTime = ts;

  if (!paused) {
    simTime += dt * 60 * 4;
    if (simTime >= 1440) {
      simTime -= 1440; simDay++;
      if (simDay > 365) { simDay=1; simYear++; }
      document.getElementById('s-day').textContent  = simDay;
      document.getElementById('s-year').textContent = simYear;
    }
    const h=Math.floor(simTime/60)%24, m=Math.floor(simTime%60);
    document.getElementById('clock').textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');

    for (const a of agents) {
      a.nextDecision -= dt;
      if (a.nextDecision <= 0) {
        const tz = getScheduledZone(a);
        if (tz !== a.targetZone || !a.moving) moveAgentTo(a, tz);
        a.nextDecision = 8 + Math.random()*12;
      }
      if (a.moving) {
        const dx=a.tx-a.x, dy=a.ty-a.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if (dist < 1.5) {
          a.x=a.tx; a.y=a.ty; a.moving=false;
          a.currentZone=a.targetZone;
          a.status='at '+(zones[a.targetZone]?.label||'');
          a.trail=[];
        } else {
          const spd=a.speed*60*dt;
          a.x+=(dx/dist)*Math.min(spd,dist);
          a.y+=(dy/dist)*Math.min(spd,dist);
          a.trail.push({x:a.x,y:a.y});
          if (a.trail.length>12) a.trail.shift();
        }
      }
    }

    eventTimer+=dt;
    if (eventTimer > 3.5/speed) { eventTimer=0; if (Math.random()<.45) addEvent(); }
    statsTimer+=dt;
    if (statsTimer>5) { statsTimer=0; updateStats(); }
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Background
  ctx.fillStyle='#1c3a1c';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Zones
  for (const [key,z] of Object.entries(zones)) {
    const x=z.x*canvas.width, y=z.y*canvas.height, w=z.w*canvas.width, h=z.h*canvas.height;
    ctx.fillStyle=z.fill; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=z.color; ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);
    ctx.fillStyle='#f5c842';
    ctx.font=`bold ${Math.max(7,Math.min(10,w/8))}px 'VT323',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const lines=z.label.split('\n');
    lines.forEach((line,i)=>{ ctx.fillText(line,x+w/2,y+h/2+(i-(lines.length-1)/2)*12); });
  }

  // Agents
  for (const a of agents) {
    if (a.trail.length>1) {
      ctx.beginPath();
      ctx.moveTo(a.trail[0].x,a.trail[0].y);
      for (let i=1;i<a.trail.length;i++) ctx.lineTo(a.trail[i].x,a.trail[i].y);
      ctx.strokeStyle=a.color+'33'; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
    ctx.fillStyle=a.color; ctx.fill();
    if (a===hoveredAgent) {
      ctx.beginPath();
      ctx.arc(a.x,a.y,a.r+3,0,Math.PI*2);
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    }
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
